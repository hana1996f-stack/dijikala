{% extends 'base.html' %}
{% block title %}Seller Panel | DijiKala{% endblock %}

{% block content %}
<h2>👨‍💼 Seller Panel</h2>

<a href="{% url 'create_store' %}" class="btn">+ Create New Store</a>
<a href="{% url 'payment' %}" class="btn">
    Increase Balance
</a>

<div class="card-grid" style="margin-top: 20px;">
    {% if store %}
        <div class="card">
            <h3>{{ store.name }}</h3>
            <a href="{% url 'store_detail' store.id %}" class="btn">Manage Store</a>
        </div>
    {% else %}
        <p>You have no stores yet.</p>
    {% endif %}
</div>
{% endblock %}
